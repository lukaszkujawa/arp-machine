<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="650" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">ARP Machine Wiring Diagram</text>

  <!-- NodeMCU Board -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="200" height="320" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">NodeMCU ESP8266</text>

    <!-- USB connector -->
    <rect x="70" y="-15" width="60" height="20" rx="3" fill="#888" stroke="#666"/>
    <text x="100" y="-2" text-anchor="middle" font-size="8" fill="#333">USB</text>

    <!-- Left pins -->
    <g fill="#fff" font-size="9">
      <!-- Pin holes left -->
      <circle cx="20" cy="50" r="4" fill="#c9a227"/>
      <circle cx="20" cy="70" r="4" fill="#c9a227"/>
      <circle cx="20" cy="90" r="4" fill="#c9a227"/>
      <circle cx="20" cy="110" r="4" fill="#c9a227"/>
      <circle cx="20" cy="130" r="4" fill="#c9a227"/>
      <circle cx="20" cy="150" r="4" fill="#c9a227"/>
      <circle cx="20" cy="170" r="4" fill="#c9a227"/>
      <circle cx="20" cy="190" r="4" fill="#c9a227"/>
      <circle cx="20" cy="210" r="4" fill="#c9a227"/>
      <circle cx="20" cy="230" r="4" fill="#c9a227"/>
      <circle cx="20" cy="250" r="4" fill="#c9a227"/>
      <circle cx="20" cy="270" r="4" fill="#c9a227"/>
      <circle cx="20" cy="290" r="4" fill="#c9a227"/>

      <!-- Pin labels left -->
      <text x="35" y="53" fill="#aaa">A0</text>
      <text x="35" y="73" fill="#aaa">RSV</text>
      <text x="35" y="93" fill="#aaa">RSV</text>
      <text x="35" y="113" fill="#aaa">SD3</text>
      <text x="35" y="133" fill="#aaa">SD2</text>
      <text x="35" y="153" fill="#aaa">SD1</text>
      <text x="35" y="173" fill="#aaa">CMD</text>
      <text x="35" y="193" fill="#aaa">SD0</text>
      <text x="35" y="213" fill="#aaa">CLK</text>
      <text x="35" y="233" fill="#ff6b6b">GND</text>
      <text x="35" y="253" fill="#4ecdc4">3V3</text>
      <text x="35" y="273" fill="#aaa">EN</text>
      <text x="35" y="293" fill="#aaa">RST</text>
    </g>

    <!-- Right pins -->
    <g fill="#fff" font-size="9">
      <!-- Pin holes right -->
      <circle cx="180" cy="50" r="4" fill="#c9a227"/>
      <circle cx="180" cy="70" r="4" fill="#c9a227"/>
      <circle cx="180" cy="90" r="4" fill="#c9a227"/>
      <circle cx="180" cy="110" r="4" fill="#c9a227"/>
      <circle cx="180" cy="130" r="4" fill="#c9a227"/>
      <circle cx="180" cy="150" r="4" fill="#c9a227"/>
      <circle cx="180" cy="170" r="4" fill="#c9a227"/>
      <circle cx="180" cy="190" r="4" fill="#c9a227"/>
      <circle cx="180" cy="210" r="4" fill="#c9a227"/>
      <circle cx="180" cy="230" r="4" fill="#c9a227"/>
      <circle cx="180" cy="250" r="4" fill="#c9a227"/>
      <circle cx="180" cy="270" r="4" fill="#c9a227"/>
      <circle cx="180" cy="290" r="4" fill="#c9a227"/>

      <!-- Pin labels right -->
      <text x="130" y="53" text-anchor="end" fill="#ffe66d">D0 (GPIO16)</text>
      <text x="130" y="73" text-anchor="end" fill="#95e1d3">D1 (GPIO5)</text>
      <text x="130" y="93" text-anchor="end" fill="#95e1d3">D2 (GPIO4)</text>
      <text x="130" y="113" text-anchor="end" fill="#ffe66d">D3 (GPIO0)</text>
      <text x="130" y="133" text-anchor="end" fill="#ffe66d">D4 (GPIO2)</text>
      <text x="130" y="153" text-anchor="end" fill="#ff9a8b">D5 (GPIO14)</text>
      <text x="130" y="173" text-anchor="end" fill="#ff9a8b">D6 (GPIO12)</text>
      <text x="130" y="193" text-anchor="end" fill="#ff9a8b">D7 (GPIO13)</text>
      <text x="130" y="213" text-anchor="end" fill="#aaa">D8 (GPIO15)</text>
      <text x="130" y="233" text-anchor="end" fill="#aaa">RX (GPIO3)</text>
      <text x="130" y="253" text-anchor="end" fill="#a8e6cf">TX (GPIO1)</text>
      <text x="130" y="273" text-anchor="end" fill="#ff6b6b">GND</text>
      <text x="130" y="293" text-anchor="end" fill="#4ecdc4">3V3</text>
    </g>
  </g>

  <!-- Rotary Encoder -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="120" height="100" rx="5" fill="#2d3436" stroke="#333" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Rotary Encoder</text>
    <circle cx="60" cy="55" r="20" fill="#636e72" stroke="#b2bec3" stroke-width="2"/>
    <circle cx="60" cy="55" r="8" fill="#2d3436"/>

    <!-- Encoder pins -->
    <g font-size="8" fill="#fff">
      <rect x="10" y="85" width="8" height="12" fill="#c9a227"/>
      <text x="14" y="107" text-anchor="middle">GND</text>

      <rect x="30" y="85" width="8" height="12" fill="#c9a227"/>
      <text x="34" y="107" text-anchor="middle">+</text>

      <rect x="50" y="85" width="8" height="12" fill="#c9a227"/>
      <text x="54" y="107" text-anchor="middle">SW</text>

      <rect x="70" y="85" width="8" height="12" fill="#c9a227"/>
      <text x="74" y="107" text-anchor="middle">DT</text>

      <rect x="90" y="85" width="8" height="12" fill="#c9a227"/>
      <text x="94" y="107" text-anchor="middle">CLK</text>
    </g>
  </g>

  <!-- Buttons -->
  <g transform="translate(620, 260)">
    <!-- BTN_PAUSE -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="50" height="40" rx="3" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>
      <circle cx="25" cy="18" r="10" fill="#0984e3"/>
      <text x="25" y="50" text-anchor="middle" font-size="8" fill="#333">PAUSE</text>
      <text x="25" y="60" text-anchor="middle" font-size="7" fill="#666">(D6)</text>
    </g>

    <!-- BTN_SWITCH -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="50" height="40" rx="3" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2"/>
      <circle cx="25" cy="18" r="10" fill="#6c5ce7"/>
      <text x="25" y="50" text-anchor="middle" font-size="8" fill="#333">SWITCH</text>
      <text x="25" y="60" text-anchor="middle" font-size="7" fill="#666">(D7)</text>
    </g>

    <!-- BTN_REGEN -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="50" height="40" rx="3" fill="#fd79a8" stroke="#e84393" stroke-width="2"/>
      <circle cx="25" cy="18" r="10" fill="#e84393"/>
      <text x="25" y="50" text-anchor="middle" font-size="8" fill="#333">REGEN</text>
      <text x="25" y="60" text-anchor="middle" font-size="7" fill="#666">(D5)</text>
    </g>
  </g>

  <!-- OLED Display -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="140" height="90" rx="5" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
    <rect x="10" y="10" width="120" height="60" rx="2" fill="#000" stroke="#333"/>
    <text x="70" y="45" text-anchor="middle" font-size="10" fill="#00ff00">128x64 OLED</text>
    <text x="70" y="57" text-anchor="middle" font-size="8" fill="#00aa00">SSD1306 I2C</text>

    <!-- OLED pins -->
    <g font-size="8" fill="#fff">
      <rect x="25" y="75" width="8" height="12" fill="#c9a227"/>
      <text x="29" y="97" text-anchor="middle">GND</text>

      <rect x="50" y="75" width="8" height="12" fill="#c9a227"/>
      <text x="54" y="97" text-anchor="middle">VCC</text>

      <rect x="75" y="75" width="8" height="12" fill="#c9a227"/>
      <text x="79" y="97" text-anchor="middle">SCL</text>

      <rect x="100" y="75" width="8" height="12" fill="#c9a227"/>
      <text x="104" y="97" text-anchor="middle">SDA</text>
    </g>
  </g>

  <!-- MIDI DIN Connector -->
  <g transform="translate(80, 420)">
    <text x="70" y="-10" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">MIDI OUT</text>

    <!-- DIN connector body -->
    <circle cx="70" cy="50" r="45" fill="#2d3436" stroke="#333" stroke-width="2"/>
    <circle cx="70" cy="50" r="38" fill="#1a1a2e"/>

    <!-- Pin arrangement (180 degree DIN-5) -->
    <!-- Pin 2 (top center) - GND/Shield -->
    <circle cx="70" cy="25" r="5" fill="#c9a227"/>
    <text x="70" y="15" text-anchor="middle" font-size="8" fill="#ff6b6b">2</text>

    <!-- Pin 4 (left) - +5V via resistor -->
    <circle cx="40" cy="55" r="5" fill="#c9a227"/>
    <text x="25" y="58" text-anchor="middle" font-size="8" fill="#4ecdc4">4</text>

    <!-- Pin 5 (right) - TX via resistor -->
    <circle cx="100" cy="55" r="5" fill="#c9a227"/>
    <text x="115" y="58" text-anchor="middle" font-size="8" fill="#a8e6cf">5</text>

    <!-- Pins 1 and 3 (not connected) -->
    <circle cx="50" cy="75" r="5" fill="#636e72"/>
    <text x="40" y="88" text-anchor="middle" font-size="7" fill="#888">1 NC</text>

    <circle cx="90" cy="75" r="5" fill="#636e72"/>
    <text x="100" y="88" text-anchor="middle" font-size="7" fill="#888">3 NC</text>

    <text x="70" y="110" text-anchor="middle" font-size="9" fill="#666">(view from solder side)</text>
  </g>

  <!-- Resistors for MIDI -->
  <g transform="translate(200, 440)">
    <!-- R1: 3V3 to Pin 4 -->
    <rect x="0" y="0" width="50" height="16" rx="2" fill="#d4a574" stroke="#8b7355" stroke-width="1"/>
    <line x1="5" y1="8" x2="12" y2="8" stroke="#8b7355" stroke-width="1"/>
    <line x1="38" y1="8" x2="45" y2="8" stroke="#8b7355" stroke-width="1"/>
    <g font-size="6" fill="#333">
      <rect x="12" y="3" width="4" height="10" fill="#ff0000"/>
      <rect x="17" y="3" width="4" height="10" fill="#ff0000"/>
      <rect x="22" y="3" width="4" height="10" fill="#8b4513"/>
      <rect x="27" y="3" width="4" height="10" fill="#c9a227"/>
    </g>
    <text x="25" y="30" text-anchor="middle" font-size="9" fill="#333">220R</text>

    <!-- R2: TX to Pin 5 -->
    <rect x="0" y="50" width="50" height="16" rx="2" fill="#d4a574" stroke="#8b7355" stroke-width="1"/>
    <line x1="5" y1="58" x2="12" y2="58" stroke="#8b7355" stroke-width="1"/>
    <line x1="38" y1="58" x2="45" y2="58" stroke="#8b7355" stroke-width="1"/>
    <g font-size="6" fill="#333">
      <rect x="12" y="53" width="4" height="10" fill="#ff0000"/>
      <rect x="17" y="53" width="4" height="10" fill="#ff0000"/>
      <rect x="22" y="53" width="4" height="10" fill="#8b4513"/>
      <rect x="27" y="53" width="4" height="10" fill="#c9a227"/>
    </g>
    <text x="25" y="80" text-anchor="middle" font-size="9" fill="#333">220R</text>
  </g>

  <!-- Wiring lines -->
  <g fill="none" stroke-width="2" stroke-linecap="round">

    <!-- OLED connections -->
    <!-- SDA: OLED to D2 -->
    <path d="M184 207 L184 240 L340 240 L340 170 L350 170" stroke="#95e1d3" stroke-dasharray="none"/>
    <!-- SCL: OLED to D1 -->
    <path d="M159 207 L159 250 L330 250 L330 150 L350 150" stroke="#95e1d3"/>
    <!-- OLED VCC to 3V3 -->
    <path d="M134 207 L134 260 L320 260 L320 370 L350 370" stroke="#4ecdc4"/>
    <!-- OLED GND -->
    <path d="M109 207 L109 270 L310 270 L310 310 L350 310" stroke="#ff6b6b"/>

    <!-- Encoder connections -->
    <!-- CLK to D4 -->
    <path d="M714 197 L714 220 L580 220 L580 210 L550 210" stroke="#ffe66d"/>
    <!-- DT to D0 -->
    <path d="M694 197 L694 140 L560 140 L560 130 L550 130" stroke="#ffe66d"/>
    <!-- SW to D3 -->
    <path d="M674 197 L674 230 L570 230 L570 190 L550 190" stroke="#ffe66d"/>
    <!-- Encoder GND -->
    <path d="M634 197 L634 350 L550 350" stroke="#ff6b6b"/>
    <!-- Encoder + to 3V3 -->
    <path d="M654 197 L654 380 L580 380 L580 370 L550 370" stroke="#4ecdc4"/>

    <!-- Button connections -->
    <!-- BTN_PAUSE D6 -->
    <path d="M620 280 L590 280 L590 250 L550 250" stroke="#ff9a8b"/>
    <!-- BTN_SWITCH D7 -->
    <path d="M730 280 L770 280 L770 350 L590 350 L590 270 L550 270" stroke="#ff9a8b"/>
    <!-- BTN_REGEN D5 -->
    <path d="M650 330 L600 330 L600 230 L550 230" stroke="#ff9a8b"/>

    <!-- Button GND connections -->
    <path d="M645 300 L645 360 L550 360" stroke="#ff6b6b" stroke-dasharray="4,2"/>
    <path d="M705 300 L705 360" stroke="#ff6b6b" stroke-dasharray="4,2"/>
    <path d="M675 400 L675 420 L560 420 L560 360" stroke="#ff6b6b" stroke-dasharray="4,2"/>

    <!-- MIDI connections -->
    <!-- TX to R2 to Pin 5 -->
    <path d="M550 330 L560 330 L560 500 L300 500 L300 498 L250 498" stroke="#a8e6cf"/>
    <path d="M200 498 L185 498 L185 475 L180 475" stroke="#a8e6cf"/>
    <!-- 3V3 to R1 to Pin 4 -->
    <path d="M550 370 L570 370 L570 448 L250 448" stroke="#4ecdc4"/>
    <path d="M200 448 L170 448 L170 475 L120 475" stroke="#4ecdc4"/>
    <!-- GND to Pin 2 -->
    <path d="M350 310 L300 310 L300 380 L150 380 L150 445" stroke="#ff6b6b"/>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 450)">
    <rect x="0" y="0" width="250" height="170" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Wire Color Legend</text>

    <g font-size="10">
      <line x1="15" y1="40" x2="45" y2="40" stroke="#ff6b6b" stroke-width="3"/>
      <text x="55" y="44" fill="#333">GND (Ground)</text>

      <line x1="15" y1="60" x2="45" y2="60" stroke="#4ecdc4" stroke-width="3"/>
      <text x="55" y="64" fill="#333">3.3V Power</text>

      <line x1="15" y1="80" x2="45" y2="80" stroke="#95e1d3" stroke-width="3"/>
      <text x="55" y="84" fill="#333">I2C (SDA/SCL)</text>

      <line x1="15" y1="100" x2="45" y2="100" stroke="#ffe66d" stroke-width="3"/>
      <text x="55" y="104" fill="#333">Encoder (CLK/DT/SW)</text>

      <line x1="15" y1="120" x2="45" y2="120" stroke="#ff9a8b" stroke-width="3"/>
      <text x="55" y="124" fill="#333">Buttons (PAUSE/SWITCH/REGEN)</text>

      <line x1="15" y1="140" x2="45" y2="140" stroke="#a8e6cf" stroke-width="3"/>
      <text x="55" y="144" fill="#333">MIDI TX</text>
    </g>
  </g>

  <!-- Pin Summary Box -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="180" height="130" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Pin Summary</text>

    <g font-size="9" fill="#333">
      <text x="10" y="35">D0 (GPIO16) - Encoder DT</text>
      <text x="10" y="48">D1 (GPIO5)  - I2C SCL</text>
      <text x="10" y="61">D2 (GPIO4)  - I2C SDA</text>
      <text x="10" y="74">D3 (GPIO0)  - Encoder SW</text>
      <text x="10" y="87">D4 (GPIO2)  - Encoder CLK</text>
      <text x="10" y="100">D5 (GPIO14) - BTN_REGEN</text>
      <text x="10" y="113">D6 (GPIO12) - BTN_PAUSE</text>
      <text x="10" y="126">D7 (GPIO13) - BTN_SWITCH</text>
    </g>
  </g>

  <!-- Notes -->
  <g transform="translate(30, 540)">
    <text x="0" y="0" font-size="10" fill="#666">Notes:</text>
    <text x="0" y="15" font-size="9" fill="#888">- All buttons use internal pull-up resistors (connect button between pin and GND)</text>
    <text x="0" y="28" font-size="9" fill="#888">- MIDI requires 2x 220 Ohm resistors for proper current limiting</text>
    <text x="0" y="41" font-size="9" fill="#888">- OLED display uses I2C address 0x3C (default)</text>
    <text x="0" y="54" font-size="9" fill="#888">- View MIDI DIN connector from solder/back side</text>
  </g>

</svg>
